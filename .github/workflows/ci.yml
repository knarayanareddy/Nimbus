name: CI

on:
  push:
    branches: [main, feat/colosseum-2026]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:adapter
      - run: npm run build
      - run: npm run typecheck
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      # Inherited high advisories are explicitly recorded, not falsely cleared.
      - run: npm audit --include=dev --audit-level=critical
  rust-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --manifest-path programs/nimbus/Cargo.toml --locked
